<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a84ff"/>
      <stop offset="100%" stop-color="#0040dd"/>
    </linearGradient>
    <linearGradient id="sunGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffd60a"/>
      <stop offset="100%" stop-color="#ff9f0a"/>
    </linearGradient>
    <linearGradient id="cloudGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#d0e1fd"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#001844" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- iOS App Icon Squircle Background -->
  <rect width="512" height="512" rx="115" fill="url(#bgGrad)"/>

  <!-- Sun Rays & Core -->
  <g filter="url(#shadow)">
    <circle cx="330" cy="190" r="80" fill="url(#sunGrad)"/>
  </g>

  <!-- Cloud Front -->
  <g filter="url(#shadow)">
    <path d="M170 370 h200 a70 70 0 0 0 0 -140 a75 75 0 0 0 -85 -55 a95 95 0 0 0 -170 45 a65 65 0 0 0 55 150 z" fill="url(#cloudGrad)"/>
  </g>
</svg>
